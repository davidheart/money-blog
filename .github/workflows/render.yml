# 풀 리퀘스트에서는 조립과 렌더만 한다.
# main 푸시에서는 블로그(_site)를 GitHub Pages에 올린다.
# 책 PDF·EPUB은 올리지 않는다. 저장소 공개와 Pages 설정은 바꾸지 않는다.

name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: website and book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Install PyYAML
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-yaml

      # 브라우저에서 글을 커밋해도 여기서 배너와 책 목차를 다시 만든다.
      # 만든 책 파일은 이 실행 안에서만 쓴다.
      - name: Assemble book from posts
        run: python3 scripts/assemble_book.py

      - name: Render website
        run: quarto render

      - name: Render book HTML
        run: quarto render book --to html

      - name: Render book EPUB
        run: quarto render book --to epub --no-clean

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
